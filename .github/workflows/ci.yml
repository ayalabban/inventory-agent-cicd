
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/ayalabban/inventory-agent-cicd:latest .

      - name: Push Docker image
        run: docker push ghcr.io/ayalabban/inventory-agent-cicd:latest


  deploy:
    needs: test
    runs-on: [self-hosted, inventory-agent-deploy]

    permissions:
      packages: read

    steps:
      - name: Check Docker on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker info

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: docker pull --platform linux/amd64 ghcr.io/ayalabban/inventory-agent-cicd:latest

      - name: Deploy Inventory Agent on Windows
        if: runner.os == 'Windows'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $existing = @()

          $existing += docker ps -aq --filter "name=^/inventory-agent$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $existing += docker ps -aq --filter "name=^/determined_shannon$"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $existing = $existing | Where-Object { $_ } | Select-Object -Unique

          if ($existing) {
            docker rm -f $existing
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          docker run -d --platform linux/amd64 --name inventory-agent -p 127.0.0.1:8000:8000 -e "GEMINI_API_KEY=$env:GEMINI_API_KEY" ghcr.io/ayalabban/inventory-agent-cicd:latest
          exit $LASTEXITCODE